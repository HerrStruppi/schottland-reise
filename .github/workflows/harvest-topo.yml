# Einmaliger Kachel-Einsammler: lädt den Geländekarten-Korridor von OpenTopoMap
# (höflich, 2 Verbindungen) und committet die Paketdateien nach tiles/.
# Läuft nur auf Zuruf: manuell über "Run workflow" oder wenn ein Push, der
# dieses Workflow-File bzw. topo-harvest.mjs ändert, "[harvest]" in der
# Commit-Message trägt.
name: Geländekarte einsammeln

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harvest-topo.yml'
      - 'topo-harvest.mjs'

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[harvest]')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # Zwischenstand aus einem früheren (abgebrochenen) Lauf übernehmen
      - uses: actions/cache/restore@v4
        with:
          path: topo-tiles
          key: topo-tiles-v1-${{ github.run_id }}
          restore-keys: topo-tiles-v1-

      - name: Kacheln laden und packen
        run: node topo-harvest.mjs
        env:
          TIME_BUDGET_MIN: "280"   # sauber aufhören, bevor timeout-minutes zuschlägt

      # Auch bei Fehlschlag/Zeitbudget-Ende sichern – der nächste Lauf setzt fort
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: topo-tiles
          key: topo-tiles-v1-${{ github.run_id }}

      - name: Pakete committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiles/topo-pack-*.tpk tiles/topo-meta.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Paketen – nichts zu committen."
            exit 0
          fi
          git commit -m "Geländekarte: Kachelpakete für Selbst-Hosting (OpenTopoMap-Spiegel, CC-BY-SA)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
